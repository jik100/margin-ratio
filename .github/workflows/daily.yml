name: 信用倍率を毎日記録

on:
  schedule:
    - cron: "30 8 * * 1-5"   # 日本時間 平日17:30 (UTC 08:30)
  workflow_dispatch:          # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python jpx_margin_ratio.py --out docs/margin_ratio.csv
      - run: cp docs/margin_ratio.html docs/index.html
      - name: 変更があれば保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
